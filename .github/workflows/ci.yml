name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tilqor
          POSTGRES_USER: tilqor
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilqor -d tilqor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "false"
      POSTGRES_DB: tilqor
      POSTGRES_USER: tilqor
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r src/backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/backend tests

      - name: Check migrations
        run: python src/backend/manage.py makemigrations --check --dry-run

      - name: Run tests (pytest)
        run: pytest -v
