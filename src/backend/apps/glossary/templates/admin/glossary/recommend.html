{% extends "admin/base_site.html" %}
{% block content %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <p>Set the recommended variant for the following term(s):</p>
  <ul>
    {% for term in terms %}
    <li>{{ term }}<input type="hidden" name="_selected_action" value="{{ term.pk }}"></li>
    {% endfor %}
  </ul>
  <input type="hidden" name="action" value="recommend_variant">
  <input type="hidden" name="select_across" value="0">
  <button type="submit" name="apply_recommendation" value="1">Apply recommendation</button>
</form>
{% endblock %}
